<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hospital Emergency</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <h2>🏥 Hospital Emergency</h2>
</header>

<div class="container">

  <h3>Emergency Request</h3>

  <input type="text" placeholder="Patient Name">
  <input type="tel" placeholder="Phone Number">

  <select>
    <option>Accident</option>
    <option>Heart Attack</option>
    <option>Critical Care</option>
    <option>Other</option>
  </select>

  <textarea placeholder="Describe Emergency"></textarea>

  <button class="btn-red">Send Emergency</button>

  <hr>

  <h3>Hospitals Nearby You</h3>

  <div class="card">
    <strong>Apollo Hospital</strong>
    <p>2.2 km away</p>
    <button class="btn-outline">View Details</button>
  </div>

  <div class="card">
    <strong>Fortis Hospital</strong>
    <p>2.8 km away</p>
    <button class="btn-outline">View Details</button>
  </div>

</div>

</body>
</html>
